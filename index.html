<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>漢字変換タイピングゲーム｜社会人向け日本語入力練習</title>

<style>
:root{ --max:980px; }

body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
  margin:0;
  line-height:1.7;
  background:#fafafa;
  font-size:12px;
}

header, main, footer{
  max-width:var(--max);
  margin:0 auto;
  padding:16px;
}

.muted{ color:#555; }

#text{
  font-size:1.4em;
  background:#f3f3f3;
  padding:5px;
  border-radius:5px;
  white-space:pre-wrap;
  line-height:2;
  margin-bottom:6px;

  /* ★ 見本文コピー完全抑止 */
  user-select:none;
  -webkit-user-select:none;
  -ms-user-select:none;
  -webkit-touch-callout:none;
}

#input{
  font-size:1.4em;
  width:100%;
  height:70px;
  border:3px solid #000;
  border-radius:5px;
  line-height:2;
  resize:none;

  /* ★ スマホ長押し抑止（補助） */
  -webkit-touch-callout:none;
}

.typingArea{ position:relative; }
</style>
</head>

<body>

<main>
  <section>
    <h2>漢字変換（IME）対応タイピング練習</h2>

    <p class="muted"><strong>【見本文】</strong></p>
    <p id="text">これは見本文です。コピーや長押しができないようになっています。</p>

    <div class="typingArea">
      <p class="muted"><strong>【タイピング入力欄】</strong></p>
      <textarea id="input" autocomplete="off" spellcheck="false"></textarea>
    </div>

    <div id="result"></div>
  </section>
</main>

<!-- ★ Android / iPhone 共通：長押し・コピー強化抑止 -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const textEl  = document.getElementById("text");
  const inputEl = document.getElementById("input");

  /* ========= 見本文（#text） ========= */

  // コピー・切り取り・右クリック（長押し）無効
  ["copy","cut","contextmenu","selectstart"].forEach(evt => {
    textEl.addEventListener(evt, e => e.preventDefault());
  });

  // Android対策：長押し開始点を潰す
  textEl.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
      e.preventDefault();
    }
  }, { passive:false });

  /* ========= 入力欄（#input） ========= */

  // 長押しメニュー（貼り付け等）の入口を遮断
  inputEl.addEventListener("contextmenu", e => e.preventDefault());

  // Androidで効く：選択開始を抑止
  inputEl.addEventListener("selectstart", e => e.preventDefault());
});
</script>

</body>
</html>
